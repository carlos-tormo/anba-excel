name: Process Task

# Se dispara a mano desde la pestaña Actions del repo.
# Te pide el número de issue.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Número del issue (sin #)"
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      ISSUE: ${{ github.event.inputs.issue_number }}
    timeout-minutes: 30

    steps:
      # 1. Descargar el código
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}

      # 2. Instalar Claude Code
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code

      # 3. Crear una rama aislada para este issue
      - run: |
          git config user.name "claude-agent"
          git config user.email "claude-agent@users.noreply.github.com"
          git checkout -b agent/issue-${{ env.ISSUE }}

      # 4. Leer el issue y dejar que Claude trabaje
      - name: Claude trabaja en el issue
        run: |
          ISSUE_BODY=$(gh issue view $ISSUE --json title,body,labels --jq '"Issue #" + (.number|tostring) + ": " + .title + "\n\n" + .body + "\n\nLabels: " + ([.labels[].name] | join(", "))')

          claude -p "
          Lee este issue y haz los cambios necesarios en el código para resolverlo.
          Cuando termines, asegúrate de que el código compila/funciona.

          $ISSUE_BODY
          " --allowedTools "Bash,Read,Edit,Write"

      # 5. Commit + push + abrir PR
      - name: Crear PR si hay cambios
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Claude no hizo cambios"
            exit 0
          fi
          git commit -m "Fix #$ISSUE — cambios automáticos por Claude"
          git push origin agent/issue-$ISSUE
          gh pr create \
            --head "agent/issue-$ISSUE" \
            --title "Fix #$ISSUE" \
            --body "Cambios automáticos generados por Claude Code para resolver #$ISSUE." \
            --label "agent"
